<!DOCTYPE html>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Skills aleatórias registradas no Grimório e seladas para sempre soam como expressão (a build é minha) ou como caça-níquel? -->
<!-- Date: 2026-11-02 -->
<html lang="pt-br">
<head>
<meta charset="utf-8">
<title>Forja das Hordas — protótipo do Grimório</title>
<style>
body{margin:0;background:#111;color:#ddd;font-family:system-ui,sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;overflow:hidden}
#wrap{position:relative;width:960px;height:640px}
canvas{display:block;background:#1b1a17}
.ov{position:absolute;inset:0;background:rgba(10,10,10,.9);display:none;flex-direction:column;align-items:center;justify-content:safe center;gap:10px;padding:20px;box-sizing:border-box;text-align:center;overflow:auto}
.ov.on{display:flex}
.ov h2{margin:4px 0}.ov p{margin:2px 0;max-width:760px;line-height:1.45}
.cards{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:220px;padding:12px;border:2px solid #555;border-radius:8px;background:#222;cursor:pointer;text-align:left;font-size:14px}
.card.sm{width:170px;padding:8px;font-size:12px}
.card:hover{border-color:#c9b458}
.card.sel{border-color:#c9b458;background:#332e1a}
.card b{display:block;font-size:16px;margin:3px 0}
.tag{font-size:11px;color:#c9b458;letter-spacing:.04em}
button{font-size:15px;padding:8px 16px;border-radius:6px;border:1px solid #777;background:#333;color:#eee;cursor:pointer;margin:2px}
button:disabled{opacity:.4;cursor:default}
textarea{width:560px;height:54px;font-size:14px;background:#222;color:#eee;border:1px solid #666}
#logBtn{position:absolute;top:4px;right:4px;font-size:11px;padding:3px 8px;z-index:6}
#logov{z-index:7}#logov textarea{width:820px;height:440px;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="640"></canvas>
  <div id="ov" class="ov"></div>
  <div id="logov" class="ov"><h2>Log da sessão</h2><p>Copiado para a área de transferência (se o navegador permitir). Senão, Ctrl+A e Ctrl+C.</p><textarea readonly></textarea><button id="logClose">Fechar</button></div>
  <button id="logBtn">Log</button>
</div>
<script>
// PROTOTYPE - NOT FOR PRODUCTION — Grimório + selamento. Values hardcoded on purpose.
const K = {
  STAGE_TIME: 90,          // segundos até o chefe aparecer
  SEAL_STAGE_TIME: 60,     // Prova do Selo
  STAGES_BEFORE_SEAL: 3,   // chefes vencidos antes do selamento
  SEAL_COUNT: 4,           // skills seladas
  REROLLS_PER_STAGE: 1,
  FAVOR_WEIGHT: 3,         // multiplicador de peso da skill favorecida
  MAX_SKILLS: 6, MAX_LEVEL: 5,
  PLAYER_HP: 100, PLAYER_SPEED: 210, PICKUP: 40,
  STAGE_SCALE: 0.3,        // dificuldade extra por chefe vencido
  ENEMY_CAP: 220, BOSS_HP: 700,
};
const W = 960, H = 640, cv = document.getElementById('c'), cx = cv.getContext('2d');
const ov = document.getElementById('ov'), lo = document.getElementById('logov');
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const dist2 = (a, b) => (a.x - b.x) ** 2 + (a.y - b.y) ** 2;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const T0 = performance.now(), secs = t => +((performance.now() - t) / 1000).toFixed(1);
const G = { grimoire: {}, wins: 0, favor: null, sealed: null, hero: 1, log: [] };
const log = (ev, data = {}) => G.log.push({ t: secs(T0), hero: G.hero, ev, ...data });
let S = null;
const keys = {};
addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if (e.key.startsWith('Arrow')) e.preventDefault(); });
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ---------- skills ----------
const SK = {
  lanca:     { n: 'Lança de Osso', d: 'Arremessa uma lança perfurante no inimigo mais próximo.', upd: l => { if (every('lanca', 1.5 - .15 * l)) shoot(nearest(), 520, 18 + 6 * l, 3 + l, 6, '#eee'); } },
  giratorio: { n: 'Machado Giratório', d: 'Machados orbitam ao seu redor.', upd: l => axes(l < 3 ? 2 : l < 5 ? 3 : 4, 70, 3, 8 + 3 * l) },
  brado:     { n: 'Brado de Guerra', d: 'Onda de choque periódica que empurra a horda.', upd: l => { if (every('brado', 3.6 - .3 * l)) nova(90 + 15 * l, 15 + 8 * l, 220); } },
  raio:      { n: 'Raio Ancestral', d: 'Raio num inimigo aleatório que salta para os vizinhos.', upd: l => { if (every('raio', 1.7 - .15 * l)) bolt(25 + 10 * l, l >= 3 ? 2 : 1, 0); } },
  totem:     { n: 'Totem de Fogo', d: 'Deixa no chão uma área que queima.', upd: l => { if (every('totem', 4)) S.zones.push({ x: S.p.x, y: S.p.y, r: 50 + 8 * l, dps: 10 + 5 * l, life: 3 + .4 * l, heal: 0 }); } },
  chuva:     { n: 'Chuva de Lâminas', d: 'Lâminas caem sobre inimigos aleatórios.', upd: l => { if (every('chuva', 1 - .08 * l)) for (let i = 0; i < l; i++) blade(14 + 5 * l); } },
  investida: { n: 'Investida', d: 'Avança na direção do movimento, atropelando a horda.', upd: l => { if (every('investida', 3.2 - .3 * l)) dash(150, 20 + 10 * l); } },
  correntes: { n: 'Correntes', d: 'Aura que prende e desacelera os inimigos próximos.', upd: l => aura(80 + 15 * l, .3 + .05 * l, 3 * l) },
  sangue:    { n: 'Sangue Fervente', d: 'Passiva: cada abate cura um pouco.' },
  pele:      { n: 'Pele de Pedra', d: 'Passiva: reduz o dano recebido.' },
  furia:     { n: 'Fúria', d: 'Passiva: todas as skills e o ataque disparam mais rápido.' },
  ima:       { n: 'Ímã de Almas', d: 'Passiva: coleta XP de mais longe.' },
  tornado:    { n: 'Tornado de Aço', evo: ['giratorio', 'furia'], d: 'EVOLUÇÃO de Machado Giratório (nv 5) + Fúria: seis machados em alta velocidade.', upd: () => axes(6, 95, 4.5, 30) },
  tempestade: { n: 'Tempestade Acorrentada', evo: ['raio', 'correntes'], d: 'EVOLUÇÃO de Raio Ancestral (nv 5) + Correntes: raios em cadeia que prendem.', upd: () => { if (every('tempestade', .7)) bolt(80, 5, 1); } },
  pira:       { n: 'Pira de Sangue', evo: ['totem', 'sangue'], d: 'EVOLUÇÃO de Totem de Fogo (nv 5) + Sangue Fervente: piras enormes que curam você.', upd: () => { if (every('pira', 3)) S.zones.push({ x: S.p.x, y: S.p.y, r: 110, dps: 45, life: 4, heal: .3 }); } },
};
const lv = id => S.skills[id] || 0;
const atkMul = () => 1 + .12 * lv('furia');
function every(id, p) { S.cd[id] = (S.cd[id] || 0) + S.dt * atkMul(); if (S.cd[id] >= p) { S.cd[id] = 0; return true; } return false; }
function nearest() { let b = null, bd = Infinity; for (const e of S.en) { if (e.dead) continue; const d = dist2(e, S.p); if (d < bd) { bd = d; b = e; } } return b; }
function hit(e, dmg) {
  if (e.dead) return;
  e.hp -= dmg; e.flash = .08;
  if (e.hp > 0) return;
  e.dead = true; S.kills++;
  if (e.boss) S.won = true; else S.gems.push({ x: e.x, y: e.y });
  S.p.hp = Math.min(S.p.max, S.p.hp + .5 * lv('sangue'));
}
function shoot(t, spd, dmg, pierce, r, col) {
  if (!t) return;
  const a = Math.atan2(t.y - S.p.y, t.x - S.p.x);
  S.pr.push({ x: S.p.x, y: S.p.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd, dmg, pierce, r, col, life: 1.6, hits: new Set() });
}
function axes(n, rad, spd, dmg) {
  S.axA = (S.axA || 0) + spd * S.dt;
  for (let i = 0; i < n; i++) {
    const a = S.axA + i * Math.PI * 2 / n, x = S.p.x + Math.cos(a) * rad, y = S.p.y + Math.sin(a) * rad;
    S.draw.push({ k: 'axe', x, y });
    for (const e of S.en) if (!e.dead && (e.axcd || 0) <= S.time && (e.x - x) ** 2 + (e.y - y) ** 2 < (e.r + 12) ** 2) { hit(e, dmg); e.axcd = S.time + .4; }
  }
}
function nova(r, dmg, kb) {
  S.fx.push({ k: 'ring', x: S.p.x, y: S.p.y, r, life: .3, max: .3, col: '#c9b458' });
  for (const e of S.en) {
    const d = Math.sqrt(dist2(e, S.p)) || 1;
    if (e.dead || d > r + e.r) continue;
    hit(e, dmg);
    if (!e.boss) { e.kx = (e.x - S.p.x) / d * kb; e.ky = (e.y - S.p.y) / d * kb; }
  }
}
function bolt(dmg, chains, slows) {
  const alive = S.en.filter(e => !e.dead);
  if (!alive.length) return;
  let t = alive[Math.random() * alive.length | 0], from = { x: t.x, y: t.y - 300 };
  const done = new Set();
  for (let i = 0; i <= chains && t; i++) {
    S.fx.push({ k: 'line', x: from.x, y: from.y, x2: t.x, y2: t.y, life: .15, max: .15, col: '#9fd3ff', w: 3 });
    hit(t, dmg); if (slows) t.slowT = S.time + 1.5;
    done.add(t); from = t;
    let nb = null, nd = 120 * 120;
    for (const e of alive) { if (e.dead || done.has(e)) continue; const d = dist2(e, t); if (d < nd) { nd = d; nb = e; } }
    t = nb;
  }
}
function blade(dmg) {
  const alive = S.en.filter(e => !e.dead);
  if (!alive.length) return;
  const t = alive[Math.random() * alive.length | 0];
  S.fx.push({ k: 'ring', x: t.x, y: t.y, r: 30, life: .2, max: .2, col: '#ddd' });
  for (const e of alive) if (dist2(e, t) < (30 + e.r) ** 2) hit(e, dmg);
}
function segDist(p, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1, L = dx * dx + dy * dy || 1;
  const t = clamp(((p.x - x1) * dx + (p.y - y1) * dy) / L, 0, 1);
  return Math.hypot(p.x - x1 - t * dx, p.y - y1 - t * dy);
}
function dash(len, dmg) {
  const x0 = S.p.x, y0 = S.p.y;
  S.p.x = clamp(x0 + S.p.dir.x * len, 12, W - 12); S.p.y = clamp(y0 + S.p.dir.y * len, 12, H - 12);
  S.p.inv = S.time + .35;
  S.fx.push({ k: 'line', x: x0, y: y0, x2: S.p.x, y2: S.p.y, life: .2, max: .2, col: 'rgba(127,201,106,.6)', w: 22 });
  for (const e of S.en) if (!e.dead && segDist(e, x0, y0, S.p.x, S.p.y) < e.r + 18) hit(e, dmg);
}
function aura(r, slow, dps) {
  S.draw.push({ k: 'aura', r });
  for (const e of S.en) if (!e.dead && dist2(e, S.p) < (r + e.r) ** 2) { e.slow = Math.max(e.slow, slow); hit(e, dps * S.dt); }
}

// ---------- stage ----------
function newStage(sealed) {
  S = { p: { x: W / 2, y: H / 2, hp: K.PLAYER_HP, max: K.PLAYER_HP, dir: { x: 1, y: 0 }, inv: 0 },
    en: [], pr: [], gems: [], zones: [], fx: [], draw: [], cd: {}, skills: {}, choices: [],
    lvl: 1, xp: 0, next: 6, ups: 0, time: 0, dt: 0, spawnAcc: 0, boss: null, kills: 0,
    rerolls: K.REROLLS_PER_STAGE, sealed, mult: 1 + K.STAGE_SCALE * G.wins, paused: false, won: false };
  if (sealed) for (const id of G.sealed) S.skills[id] = SK[id].evo ? 1 : K.MAX_LEVEL;
  log('stage_start', { stage: G.wins + 1, sealed, favor: G.favor });
  hideOv();
}
function spawn() {
  const s = Math.random() * 4 | 0;
  const x = s === 0 ? -15 : s === 1 ? W + 15 : rnd(0, W), y = s < 2 ? rnd(0, H) : s === 2 ? -15 : H + 15;
  const hp = (12 + S.time * .35) * S.mult;
  S.en.push({ x, y, r: 9, hp, max: hp, spd: rnd(55, 85) + S.time * .2, dmg: 12 * S.mult, slow: 0 });
}
function spawnBoss() {
  const hp = K.BOSS_HP * S.mult;
  S.boss = { x: W / 2, y: -40, r: 34, hp, max: hp, spd: 60, dmg: 30 * S.mult, slow: 0, boss: true };
  S.en.push(S.boss);
}
function gainXp() {
  S.xp++;
  while (S.xp >= S.next) {
    S.xp -= S.next; S.lvl++; S.next = Math.floor(6 + S.lvl * 3.5);
    if (S.sealed) S.p.hp = Math.min(S.p.max, S.p.hp + 10); else S.ups++;
  }
}
function update(dt) {
  S.dt = dt; S.time += dt; S.draw = [];
  let mx = (keys.d || keys.arrowright ? 1 : 0) - (keys.a || keys.arrowleft ? 1 : 0);
  let my = (keys.s || keys.arrowdown ? 1 : 0) - (keys.w || keys.arrowup ? 1 : 0);
  if (mx || my) { const l = Math.hypot(mx, my); mx /= l; my /= l; S.p.dir = { x: mx, y: my }; }
  S.p.x = clamp(S.p.x + mx * K.PLAYER_SPEED * dt, 12, W - 12);
  S.p.y = clamp(S.p.y + my * K.PLAYER_SPEED * dt, 12, H - 12);

  if (!S.boss && S.time >= (S.sealed ? K.SEAL_STAGE_TIME : K.STAGE_TIME)) spawnBoss();
  S.spawnAcc += dt * (1.6 + S.time * .06) * (S.boss ? .4 : 1);
  while (S.spawnAcc >= 1) { S.spawnAcc--; if (S.en.length < K.ENEMY_CAP) spawn(); }
  for (const e of S.en) e.slow = 0;

  if (every('base', .55)) shoot(nearest(), 420, 10, 1, 4, '#bbb');
  for (const id in S.skills) if (SK[id].upd) SK[id].upd(S.skills[id]);

  for (const b of S.pr) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    for (const e of S.en) {
      if (e.dead || b.hits.has(e) || dist2(e, b) >= (e.r + b.r) ** 2) continue;
      hit(e, b.dmg); b.hits.add(e);
      if (--b.pierce <= 0) { b.life = 0; break; }
    }
  }
  S.pr = S.pr.filter(b => b.life > 0 && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 20);

  for (const z of S.zones) {
    z.life -= dt;
    for (const e of S.en) if (!e.dead && dist2(e, z) < (z.r + e.r) ** 2) { hit(e, z.dps * dt); if (z.heal) S.p.hp = Math.min(S.p.max, S.p.hp + z.heal * dt); }
  }
  S.zones = S.zones.filter(z => z.life > 0);

  const armor = Math.min(.6, .08 * lv('pele'));
  for (const e of S.en) {
    if (e.dead) continue;
    const dx = S.p.x - e.x, dy = S.p.y - e.y, d = Math.hypot(dx, dy) || 1;
    const sl = Math.max(e.slow, (e.slowT || 0) > S.time ? .6 : 0);
    e.x += (dx / d * e.spd * (1 - sl) + (e.kx || 0)) * dt;
    e.y += (dy / d * e.spd * (1 - sl) + (e.ky || 0)) * dt;
    e.kx = (e.kx || 0) * .9; e.ky = (e.ky || 0) * .9;
    if (e.flash > 0) e.flash -= dt;
    if (d < e.r + 12 && S.time > S.p.inv) S.p.hp -= e.dmg * dt * (1 - armor);
  }
  S.en = S.en.filter(e => !e.dead);

  const pr = K.PICKUP + 40 * lv('ima');
  for (const g of S.gems) {
    const d = Math.hypot(S.p.x - g.x, S.p.y - g.y);
    if (d < 14) { g.taken = true; gainXp(); }
    else if (d < pr) { g.x += (S.p.x - g.x) / d * 450 * dt; g.y += (S.p.y - g.y) / d * 450 * dt; }
  }
  S.gems = S.gems.filter(g => !g.taken);
  for (const f of S.fx) f.life -= dt;
  S.fx = S.fx.filter(f => f.life > 0);

  if (S.won) return winStage();
  if (S.p.hp <= 0) return die();
  if (S.ups > 0) showLevelUp();
}

// ---------- level up ----------
function evolved(id) { for (const k in SK) if (SK[k].evo && SK[k].evo[0] === id && S.skills[k]) return true; return false; }
function rollChoices() {
  const pool = [], owned = Object.keys(S.skills).length;
  for (const id in SK) {
    const d = SK[id], l = lv(id);
    let kind = null;
    if (d.evo) { if (!l && lv(d.evo[0]) === K.MAX_LEVEL && lv(d.evo[1])) kind = 'evo'; }
    else if (l > 0) { if (l < K.MAX_LEVEL) kind = 'up'; }
    else if (owned < K.MAX_SKILLS && !evolved(id)) kind = 'new';
    if (!kind) continue;
    let w = kind === 'evo' ? 4 : 1;
    if (G.favor && (G.favor === id || (d.evo && d.evo[0] === G.favor))) w *= K.FAVOR_WEIGHT;
    pool.push({ id, kind, w });
  }
  const out = [];
  while (out.length < 3 && pool.length) {
    let r = Math.random() * pool.reduce((s, o) => s + o.w, 0), i = 0;
    while (i < pool.length - 1 && (r -= pool[i].w) > 0) i++;
    out.push(pool.splice(i, 1)[0]);
  }
  return out;
}
function showLevelUp() {
  S.paused = true;
  S.choices = rollChoices();
  if (!S.choices.length) { S.ups--; S.p.hp = Math.min(S.p.max, S.p.hp + 20); S.paused = false; return; }
  renderLevelUp();
}
function card(c, i) {
  const d = SK[c.id], l = lv(c.id);
  const tag = c.kind === 'new' ? 'NOVA' : c.kind === 'up' ? `NÍVEL ${l} → ${l + 1}` : 'EVOLUÇÃO';
  const marks = (G.grimoire[c.id] ? ' · ★ NO GRIMÓRIO' : '') + (G.favor === c.id ? ' · ♥ FAVORECIDA' : '');
  return `<div class="card" data-i="${i}"><span class="tag">${tag}${marks}</span><b>${d.n}</b>${d.d}</div>`;
}
function renderLevelUp() {
  ov.innerHTML = `<h2>Nível ${S.lvl}: escolha 1</h2><p>Esta skill vale só nesta fase. Vença o chefe para registrá-la no Grimório.</p>
    <div class="cards">${S.choices.map(card).join('')}</div>
    <button id="rr" ${S.rerolls ? '' : 'disabled'}>Rerolar (${S.rerolls} nesta fase)</button>`;
  showOv();
  ov.querySelectorAll('.card').forEach(el => el.onclick = () => pick(+el.dataset.i));
  ov.querySelector('#rr').onclick = () => {
    S.rerolls--; log('reroll', { stage: G.wins + 1, lvl: S.lvl, discarded: S.choices.map(c => c.id) });
    S.choices = rollChoices(); renderLevelUp();
  };
}
function pick(i) {
  const c = S.choices[i], d = SK[c.id];
  if (c.kind === 'evo') delete S.skills[d.evo[0]];
  S.skills[c.id] = (S.skills[c.id] || 0) + 1;
  log('pick', { stage: G.wins + 1, lvl: S.lvl, offered: S.choices.map(o => o.id), chose: c.id, kind: c.kind, favor: G.favor });
  S.ups--; hideOv(); S.paused = false;
}

// ---------- screens ----------
function showOv() { ov.classList.add('on'); }
function hideOv() { ov.classList.remove('on'); }
function grimoireLine() { return Object.keys(G.grimoire).map(id => `${SK[id].n} ×${G.grimoire[id]}`).join(' · '); }
function preStage() {
  S = null;
  const g = Object.keys(G.grimoire), fav = g.filter(id => !SK[id].evo);
  const extra = G.wins >= K.STAGES_BEFORE_SEAL;
  const intro = !g.length ? `<p>WASD ou setas para mover. O ataque é automático.<br>
    A cada nível, escolha 1 de 3 skills. Elas valem <b>só nesta fase</b>.<br>
    Vença o chefe (aparece em ${fmt(K.STAGE_TIME)}): as skills que você tiver são <b>registradas no Grimório</b>.<br>
    Depois de ${K.STAGES_BEFORE_SEAL} chefes você <b>sela ${K.SEAL_COUNT} skills do Grimório, para sempre</b>.</p>` : '';
  const favHtml = g.length ? `<p><b>Grimório:</b> ${grimoireLine()}</p>
    <p>Favorecer uma skill do Grimório (aparece ${K.FAVOR_WEIGHT}× mais nos sorteios desta fase):</p>
    <div class="cards">${['', ...fav].map(id => `<div class="card sm fav ${(G.favor || '') === id ? 'sel' : ''}" data-id="${id}"><b>${id ? SK[id].n : 'Nenhuma'}</b></div>`).join('')}</div>` : '';
  ov.innerHTML = `<h2>${extra ? 'Fase extra antes do selamento' : `Fase ${G.wins + 1} de ${K.STAGES_BEFORE_SEAL}`}</h2>${intro}${favHtml}<button id="go">Começar fase</button>`;
  showOv();
  let tmp = G.favor;
  ov.querySelectorAll('.fav').forEach(el => el.onclick = () => {
    tmp = el.dataset.id || null;
    ov.querySelectorAll('.fav').forEach(o => o.classList.toggle('sel', o === el));
  });
  ov.querySelector('#go').onclick = () => { G.favor = tmp; newStage(false); };
}
function winStage() {
  S.paused = true;
  if (S.sealed) { log('seal_trial_win', { time: +S.time.toFixed(1) }); return endScreen(true); }
  const reg = Object.keys(S.skills), fresh = reg.filter(id => !G.grimoire[id]);
  for (const id of reg) G.grimoire[id] = (G.grimoire[id] || 0) + 1;
  G.wins++;
  log('boss_win', { stage: G.wins, time: +S.time.toFixed(1), registered: reg, newInGrimoire: fresh });
  const toSeal = G.wins >= K.STAGES_BEFORE_SEAL;
  ov.innerHTML = `<h2>Chefe vencido!</h2><p>Registrado no Grimório:</p>
    <div class="cards">${reg.map(id => `<div class="card sm"><span class="tag">${fresh.includes(id) ? 'NOVA NO GRIMÓRIO' : `REGISTRADA ${G.grimoire[id]}×`}</span><b>${SK[id].n}</b></div>`).join('')}</div>
    <button id="nx">${toSeal ? 'Ir para o Selamento' : 'Próxima fase'}</button>`;
  showOv();
  ov.querySelector('#nx').onclick = () => toSeal ? sealScreen() : preStage();
}
function die() {
  S.paused = true;
  log('death', { stage: G.wins + 1, sealed: S.sealed, time: +S.time.toFixed(1), skills: Object.keys(S.skills) });
  if (S.sealed) return endScreen(false);
  ov.innerHTML = `<h2>Você caiu na fase ${G.wins + 1}.</h2><p>Nada desta tentativa foi registrado no Grimório.</p><button id="nx">Tentar de novo</button>`;
  showOv();
  ov.querySelector('#nx').onclick = preStage;
}
function sealScreen() {
  S = null;
  const g = Object.keys(G.grimoire), need = Math.min(K.SEAL_COUNT, g.length), sel = new Set(), t0 = performance.now();
  log('seal_screen', { grimoire: { ...G.grimoire } });
  ov.innerHTML = `<h2>O Selamento</h2><p>Escolha ${need} skills do Grimório. A build selada é <b>definitiva</b>: este herói será isso para sempre.</p>
    <div class="cards">${g.map(id => `<div class="card sm" data-id="${id}"><span class="tag">REGISTRADA ${G.grimoire[id]}×</span><b>${SK[id].n}</b>${SK[id].d}</div>`).join('')}</div>
    <textarea id="why" placeholder="Por que essas ${need}? (uma frase)"></textarea>
    <div><button id="more">Jogar mais uma fase antes de selar</button><button id="seal" disabled>Selar para sempre</button></div>`;
  showOv();
  const why = ov.querySelector('#why'), sealBtn = ov.querySelector('#seal');
  const refresh = () => { sealBtn.disabled = !(sel.size === need && why.value.trim()); };
  ov.querySelectorAll('.card').forEach(el => el.onclick = () => {
    const id = el.dataset.id;
    if (sel.has(id)) sel.delete(id); else if (sel.size < need) sel.add(id);
    el.classList.toggle('sel', sel.has(id)); refresh();
  });
  why.oninput = refresh;
  ov.querySelector('#more').onclick = () => { log('more_before_seal', { secsOnScreen: secs(t0), wasSelecting: [...sel] }); preStage(); };
  sealBtn.onclick = () => {
    G.sealed = [...sel];
    log('seal', { skills: G.sealed, reason: why.value.trim(), secsOnScreen: secs(t0), grimoireSize: g.length });
    ov.innerHTML = `<h2>Herói selado</h2><p><b>${G.sealed.map(id => SK[id].n).join(' · ')}</b></p>
      <p>Prova do Selo: sobreviva ${fmt(K.SEAL_STAGE_TIME)} com a build selada no nível máximo e vença o chefe.</p><button id="go">Começar a Prova</button>`;
    ov.querySelector('#go').onclick = () => newStage(true);
  };
}
function endScreen(won) {
  ov.innerHTML = `<h2>${won ? 'Prova do Selo vencida' : 'Você caiu na Prova do Selo'}</h2>
    <p>Herói selado: <b>${G.sealed.map(id => SK[id].n).join(' · ')}</b></p><p><b>Grimório:</b> ${grimoireLine()}</p>
    <div>${won ? '' : '<button id="retry">Tentar a Prova de novo</button>'}<button id="new">Forjar um novo herói (mantém o Grimório)</button><button id="lg">Ver log</button></div>`;
  showOv();
  if (!won) ov.querySelector('#retry').onclick = () => newStage(true);
  ov.querySelector('#new').onclick = () => { G.hero++; G.wins = 0; G.sealed = null; G.favor = null; log('new_hero'); preStage(); };
  ov.querySelector('#lg').onclick = openLog;
}
let wasPaused = null;
function openLog() {
  const txt = JSON.stringify(G.log, null, 1), ta = lo.querySelector('textarea');
  ta.value = txt; lo.classList.add('on'); ta.select();
  wasPaused = S ? S.paused : null; if (S) S.paused = true;
  if (navigator.clipboard) navigator.clipboard.writeText(txt).catch(() => {});
}
document.getElementById('logBtn').onclick = openLog;
document.getElementById('logClose').onclick = () => { lo.classList.remove('on'); if (S && wasPaused === false) S.paused = false; };

// ---------- draw ----------
function circ(x, y, r) { cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.fill(); }
function ring(x, y, r) { cx.beginPath(); cx.arc(x, y, r, 0, Math.PI * 2); cx.stroke(); }
function bar(x, y, w, h, f, col) { cx.fillStyle = '#000a'; cx.fillRect(x, y, w, h); cx.fillStyle = col; cx.fillRect(x, y, w * clamp(f, 0, 1), h); }
function draw() {
  cx.fillStyle = '#1b1a17'; cx.fillRect(0, 0, W, H);
  if (!S) return;
  for (const z of S.zones) { cx.fillStyle = z.heal ? 'rgba(170,40,110,.25)' : 'rgba(220,190,60,.2)'; circ(z.x, z.y, z.r); }
  cx.lineWidth = 2;
  for (const d of S.draw) if (d.k === 'aura') { cx.strokeStyle = 'rgba(150,150,210,.35)'; ring(S.p.x, S.p.y, d.r); }
  cx.fillStyle = '#4fa3e0'; for (const g of S.gems) circ(g.x, g.y, 3.5);
  for (const e of S.en) { cx.fillStyle = e.flash > 0 ? '#fff' : e.boss ? '#5b2d7d' : '#7a6a92'; circ(e.x, e.y, e.r); }
  if (S.boss && !S.boss.dead) bar(S.boss.x - 40, S.boss.y - 48, 80, 6, S.boss.hp / S.boss.max, '#b48ee0');
  cx.fillStyle = S.time < S.p.inv ? '#b9f0a8' : '#5c9e4a'; circ(S.p.x, S.p.y, 12);
  for (const b of S.pr) { cx.fillStyle = b.col; circ(b.x, b.y, b.r); }
  cx.fillStyle = '#d8d8d8'; for (const d of S.draw) if (d.k === 'axe') cx.fillRect(d.x - 7, d.y - 7, 14, 14);
  for (const f of S.fx) {
    cx.globalAlpha = f.life / f.max; cx.strokeStyle = f.col;
    if (f.k === 'ring') { cx.lineWidth = 3; ring(f.x, f.y, f.r * (1.2 - f.life / f.max * .2)); }
    else { cx.lineWidth = f.w; cx.beginPath(); cx.moveTo(f.x, f.y); cx.lineTo(f.x2, f.y2); cx.stroke(); }
  }
  cx.globalAlpha = 1;
  bar(0, 0, W, 6, S.xp / S.next, '#4fa3e0');
  bar(12, 16, 200, 12, S.p.hp / S.p.max, '#6cbf5a');
  const limit = S.sealed ? K.SEAL_STAGE_TIME : K.STAGE_TIME;
  cx.fillStyle = '#eee'; cx.font = '15px system-ui';
  cx.fillText(`${S.sealed ? 'Prova do Selo' : `Fase ${G.wins + 1}`} · ${S.boss ? 'CHEFE!' : 'chefe em ' + fmt(limit - S.time)} · Nv ${S.lvl}`, 224, 28);
  cx.font = '13px system-ui';
  Object.keys(S.skills).forEach((id, i) => {
    cx.fillStyle = G.grimoire[id] ? '#c9b458' : '#ddd';
    cx.fillText(`${SK[id].n}${SK[id].evo ? '' : ' ' + S.skills[id]}`, 12, H - 14 - i * 18);
  });
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S && !S.paused) update(dt);
  draw();
  requestAnimationFrame(frame);
}
preStage();
requestAnimationFrame(frame);
</script>
</body>
</html>
