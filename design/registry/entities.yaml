    added: 2026-11-04
    revised: 2026-11-05
    # was (propagate-design-change 2026-11-05): expression and notes without the split between build and compositor; variables without spawns_de_dados and ids_de_preparacao
    # was (simulacao-deterministica.md FS9, /consistency-check + propagation 2026-11-04): notes "Total spawns is declared by #7 and #8"; total_spawns = entidades_iniciais + sum spawns(w) + max_invocacoes, now ids_de_preparacao + sum spawns(w) + max_invocacoes
  - name: limiar_xp
    status: active
    source: design/gdd/fluxo-de-fase.md
