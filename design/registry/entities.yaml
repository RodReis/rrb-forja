# Game World Entity Registry
#
# PURPOSE: Single source of truth for all named game-world facts that appear
# in more than one document. Skills check this before writing new content to
# detect cross-doc inconsistencies at authoring time.
#
# RULES:
#   - Only register facts that cross system boundaries. Internal-only facts
#     (a formula used in one GDD only) do NOT need to be registered.
#   - Never delete entries — set status: deprecated instead.
#   - When a value changes: update the value, set revised: to today's date,
#     and add a comment with the old value and which GDD changed it.
#   - source: is the authoritative GDD — the one that "owns" this fact.
#     Other GDDs that reference it list themselves in referenced_by.
#   - When a new GDD references an existing entry, append its path to
#     referenced_by. Do not create a duplicate entry.
#
# WRITTEN BY: /design-system (Phase 5 — after GDD sections are approved)
#             /consistency-check (when resolving conflicts)
#             economy-designer, systems-designer (new cross-system entries,
#               after asking)
# READ BY:    /design-system (Phase 2 — before authoring begins, and after
#               Section C/D writes to conflict-check new entities/formulas)
#             /consistency-check (primary input — grep-first, GDD-second)
#             /review-all-gdds (Phase 1 — baseline for Phase 2 checks)
#             /design-review (Phase 1 — cross-doc facts, in place of sibling GDDs)
#             /content-audit (Step 2 — planned named-content count)
#             /balance-check (Phase 3 — intended constant/formula values)
#             /propagate-design-change (Step 3 — downstream GDD impact via referenced_by)
#             /asset-spec (named entities to write specs for)
#             economy-designer, systems-designer (before authoring items,
#               loot tables and formulas)
#
# SEARCH PATTERNS (for skills using Grep):
#   All entity names:        Grep pattern="^  - name:" path="design/registry/entities.yaml"
#   Specific entity:         Grep pattern="  - name: goblin" path="design/registry/entities.yaml"
#   All items:               Grep pattern="^  - name:" path="design/registry/entities.yaml" (items section)
#   What combat.md owns:     Grep pattern="source: design/gdd/combat.md"
#   What inventory.md uses:  Grep pattern="design/gdd/inventory.md" -B 8
#                            (referenced_by is a block list, so match the
#                            path; referenced_by.*inventory never matches)
#   All gold values:          Grep pattern="value_gold:"
#   Deprecated entries:      Grep pattern="status: deprecated"
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: entities | items | formulas | constants
#   Each entry: name, status, source, referenced_by[], attributes{}, added, revised
#
# LAYOUT: the one shape .claude/scripts/registry.sh reads. Each section is a
#   key at column 0 holding a block list, or [] while it is empty. Each entry
#   starts "- name: <name>" with the dash at column 2 (or 0, the same for every
#   entry of a section); its fields sit two columns past the dash, and a deeper
#   line belongs to the field above it. Quote a value that holds ": ". A line
#   in any other shape is reported as unsupported layout, with its number.

version: 1
last_updated: "2026-11-03"

# ─── ENTITIES ────────────────────────────────────────────────────────────────
# Named game-world objects: enemies, NPCs, characters, factions, bosses.
# Register an entity here when it appears in more than one GDD — e.g., an
# enemy defined in combat.md that also drops items listed in inventory.md.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: any key stats that could appear in another GDD
#   (health, damage, drops, faction, etc.)

entities: []

# Example (remove when first real entry is added):
#
# entities:
#   - name: goblin
#     status: active              # active | deprecated
#     source: design/gdd/combat.md
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md
#     health: 40
#     damage: 8
#     drops:
#       - item: goblin_arm        # must match an entry in items section
#         qty: 1
#         drop_rate: 0.8          # 0.0–1.0
#     added: 2026-03-26
#     revised: ""


# ─── ITEMS ───────────────────────────────────────────────────────────────────
# Named collectables, equipment, consumables, crafting materials, currency.
# Register an item when its name or value appears in more than one GDD.
#
# Required fields: name, status, source, referenced_by, added
# Attribute fields: value_gold, weight, stackable, category, and any stat
#   modifiers that another system (e.g., economy, crafting) might reference.

items: []

# Example:
#
# items:
#   - name: goblin_arm
#     status: active
#     source: design/gdd/combat.md   # drop defined in combat GDD
#     referenced_by:
#       - design/gdd/combat.md
#       - design/gdd/inventory.md    # inventory GDD lists its weight/stack rules
#       - design/gdd/economy.md      # economy GDD references its sell price
#     value_gold: 5
#     weight: 1
#     stackable: true
#     category: crafting_material
#     added: 2026-03-26
#     revised: ""


# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  - name: duracao_ticks
    status: active
    source: design/gdd/dados-e-balanceamento.md
    referenced_by:
      - design/gdd/dados-e-balanceamento.md
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    variables:
      - s
      - ticks_per_second
    output_range: [1, 2147483647]
    expression: "floor(s * 30 + 0.5) in decimal; reject when < 1"
    notes: "Midpoint rounds up (AwayFromZero). Below 1/60 s gives 0 and the dataset is rejected, never clamped. Upper bound is the knob's own safe range."
    added: 2026-11-03
    revised: ""
  - name: taxa_por_tick
    status: active
    source: design/gdd/dados-e-balanceamento.md
    referenced_by:
      - design/gdd/dados-e-balanceamento.md
    variables:
      - r
      - ticks_per_second
    output_range: [-3.4e38, 3.4e38]
    expression: "r / 30 as a per-tick float; a single path, chosen by the #1 data ADR (divide in decimal, or multiply by SimClock.TickSeconds)"
    notes: "Bounded by the knob's safe range divided by 30. The path is open (GDD OQ-2): dividing in decimal gives 3.33333325f for 100/s, multiplying by 1f/30f gives 3.3333335f. Summing 30 ticks is not exactly r on either path. Provisional, to be re-evaluated."
    added: 2026-11-03
    revised: 2026-11-03
  - name: capacidade_ok
    status: active
    source: design/gdd/dados-e-balanceamento.md
    referenced_by:
      - design/gdd/dados-e-balanceamento.md
    variables:
      - pico
      - capacity_margin_pct
      - cap
      - capacity_ceiling
    output_range: [0, 1]
    expression: "pico * (100 + margem_pct) <= cap * 100 AND cap <= teto (64-bit integer math)"
    notes: "Boolean (0 = rejected, 1 = ok). Peak is declared by the owner GDD (#7 for entities)."
    added: 2026-11-03
    revised: ""
  - name: grimorio_setup_ok
    status: active
    source: design/gdd/dados-e-balanceamento.md
    referenced_by:
      - design/gdd/dados-e-balanceamento.md
      - design/gdd/game-concept.md
    variables:
      - grimorio_capacity_c
      - seal_size_s
      - seal_function_slots_sf
      - pool_funcao_pf
      - pool_compartilhado_pc
    output_range: [0, 1]
    expression: "(S + 1 <= C <= P - S) AND (P_f >= S_f), P = P_f + P_c, per role"
    notes: "Boolean. Reading of the concept's 5 <= C <= |pool| - 4 as S+1 and S is an interpretation pending GDD #17 (OQ-1). Placeholders and deprecated skills are not counted."
    added: 2026-11-03
    revised: ""
  - name: k_min_ok
    status: active
    source: design/gdd/dados-e-balanceamento.md
    referenced_by:
      - design/gdd/dados-e-balanceamento.md
    variables:
      - k_min
      - seal_size_s
      - n_fases
      - replay_limit
    output_range: [0, 1]
    expression: "S <= K_min <= N_fases + R_max"
    notes: "Boolean, static part only. The dynamic invariant max(0, 4 - g, 2 - f) is a headless test of #16 and #17, not data validation."
    added: 2026-11-03
    revised: ""
  - name: knob_ok
    status: active
    source: design/gdd/dados-e-balanceamento.md
    referenced_by:
      - design/gdd/dados-e-balanceamento.md
    variables:
      - min
      - max
      - padrao
      - pior
      - sentido
    output_range: [0, 1]
    expression: "min <= padrao <= max AND (acceptance knob -> padrao on the good side of pior)"
    notes: "Boolean. Acceptance knobs without sentido (menor_melhor or maior_melhor) are rejected."
    added: 2026-11-03
    revised: ""
  - name: effective_utc
    status: active
    source: design/gdd/save-local.md
    referenced_by:
      - design/gdd/save-local.md
      - design/business-model.md
    variables:
      - max_seen_utc
      - now_utc
      - build_utc
      - clock_sanity_ms
    output_range: [build_utc, "build_utc + clock_sanity_ms"]
    expression: "if not (0 <= max_seen_utc_saved <= build_utc + clock_sanity_ms) then max_seen_utc_saved = 0; now_ok = build_utc <= now_utc <= build_utc + clock_sanity_ms; max_seen_utc = max(max_seen_utc_saved, now_utc if now_ok else max_seen_utc_saved); effective_utc = min(max(max_seen_utc, build_utc), build_utc + clock_sanity_ms)"
    notes: "Milliseconds UTC. Never decreases, except that a saved max_seen_utc outside [0, build_utc + clock_sanity_ms] is a corrupted field and counts as 0 (event 'saved time invalid'). Never overflows int64: the out-of-window clock is discarded ('invalid clock' event) and effective_utc is clamped by min(). Only #29 with signed server time may otherwise reduce max_seen_utc. max_seen_utc advancing does not dirty the save; it is written with the next commit. The #1 rejects clock_sanity_ms <= 0 or a value that overflows int64 with build_utc. Read by #26 Economy for caps and offline accrual. The 'K periods' knob does NOT exist in the #1 GDD yet (save-local.md OQ-8)."
    added: 2026-11-03
    revised: 2026-11-03
    # was (save-local.md, /design-review 2026-11-03, 1st pass): output_range [0, 9223372036854775807]; expression "max_seen_utc = max(max_seen_utc_saved, now_utc); effective_utc = max_seen_utc"
    # was (save-local.md, /design-review 2026-11-03, 2nd pass): expression "now_ok = ...; max_seen_utc = max(max_seen_utc_saved, now_utc if now_ok else max_seen_utc_saved); effective_utc = max(max_seen_utc, build_utc)" (saved value not sanitized, no min() clamp: output_range was not guaranteed)
  - name: save_sequence
    status: active
    source: design/gdd/save-local.md
    referenced_by:
      - design/gdd/save-local.md
    variables:
      - highest_sequence_seen
    output_range: [1, 9007199254740993]
    expression: "save_sequence_attempt = max(highest_sequence_reserved_this_session, highest_sequence_in_files_with_valid_checksum across main, backup and temp) + 1, reserved at the start of each attempt; a file whose save_sequence is above 2^53 is treated as corrupted"
    notes: "Strictly increasing along the live save, gaps allowed: within a session a failed attempt consumes its number. After a restoration the number MAY repeat (the corrupted commit does not count), so it is not unique across restores. Files with an invalid checksum are ignored. Used by #29 (Alpha), together with the content hash, to tell a save that regressed from one that forked."
    added: 2026-11-03
    revised: 2026-11-03
    # was (save-local.md, /design-review 2026-11-03, 1st pass): expression "save_sequence_saved + 1, only when a commit completes and is verified"; notes "A failed write consumes no number."
    # was (save-local.md, /design-review 2026-11-03, 2nd pass): output_range [1, 9223372036854775807]; expression "highest_sequence_seen (in memory and on disk, across main, backup and temp) + 1, reserved at the start of each attempt"; notes "Strictly increasing, unique per attempt" (read unverified files; unique across restore was not true)

