    output_range: [1, 2147483647]
    expression: "min(teto_vivos_horda, sum contagem_horda + escolta_total) + min(1, N_elite) + 1"
    notes: "The #7 term of the alive-list peak checked by capacidade_ok (plus 1 for the hero and the #8 term). Worst tick is the chief entry (roar resolves later in the #6 step). Provisional."
    added: 2026-11-05
    revised: ""
  - name: xp_total_fase_dados
    status: active
    source: design/gdd/horda-waves-e-inimigos.md
    referenced_by:
      - design/gdd/horda-waves-e-inimigos.md
      - design/gdd/dados-e-balanceamento.md
      - design/gdd/fluxo-de-fase.md
    variables:
      - contagem
      - xpDaMorte
      - escolta_total
    output_range: [0, 9223372036854775807]
    expression: "xp_max = sum contagem*max_pool(xp) + sum elite max_pool(xp) + escolta_total*max_pool_escolta(xp); xp_min = same with min_pool and without escort; xp_min is a reference, NOT a floor (cancellations and xp_rugido_permil reduce real XP)"
    notes: "Feeds teto_de_fase_ok (F5 of the #3), which must pass with both ends. Chief excluded. Equal xp inside a pool is not required. Provisional."
    added: 2026-11-05
    revised: ""
  - name: cronograma_ok
    status: active
    source: design/gdd/horda-waves-e-inimigos.md
    referenced_by:
      - design/gdd/horda-waves-e-inimigos.md
      - design/gdd/dados-e-balanceamento.md
      - design/gdd/fluxo-de-fase.md
    variables:
      - inicio
      - fim_pulso
      - respiro_elite_min_ticks
      - silencio_pre_chefe_ticks
    output_range: [0, 1]
    expression: "estrutura_ok AND every Elite starts >= fim_pulso + viagem_ticks of every earlier Horda + respiro_elite_min, viagem_ticks = ceil((1.01 * R_spawn + formacao_max_m) / vel_min_pool * 30) AND every later Horda starts >= Elite start + duelo_min_ticks, duelo_min_ticks = graca_max_pool + ciclo_golpe_max_pool (worst case of the pool) AND reserva_ok (each Elite window has a contiguous stretch >= janela_reserva_ticks) AND chief starts >= max fim + silencio_pre_chefe, where fim = fim_pulso + viagem_ticks for Horda and inicio + duelo_min_ticks for Elite AND escolta_cabe"
    notes: "Boolean, blocking setup check of the #1. estrutura_ok covers unique w, exactly one last Chefe, Elite count 1, empty attack cycle for Horda, chief graca + aviso_chefe_ticks_min < ticks_max_apos_chefe, alcance_inicio_aviso_m <= meia_altura_visivel_m - margem_visivel_m, escolta_por_pulso >= 1 when escolta_total > 0, no repeated archetype in a pool, vel_per_s > 0 for Horda, inicio(C) >= 1, dist_parada_m > 0 and <= the smallest alcance_inicio_aviso_m of the archetype for Elite and Chefe, every Elite and Chefe cycle has at least one alcanca_fuga hit, phase 1 Campeao cycle is the charge only, 1 <= frentes <= min(contagem, N_DIR), S <= 2^31 - 1, every cited archetype exists and is not deprecated, no Chefe-class archetype outside the Chefe entry, tick_entrada_chefe_agendado = inicio(C). Provisional."
    added: 2026-11-05
    revised: 2026-11-05
    # was (/consistency-check 2026-11-05, incomplete): notes listed estrutura_ok without alcanca_fuga, the phase-1 Campeao rule, "dist_parada_m <= alcance_inicio_aviso_m", the frentes range, S <= 2^31 - 1, deprecated/Chefe-class archetype checks (GDD #7 F10 estrutura_ok has them)
  - name: carga_tank
    status: active
    source: design/gdd/horda-waves-e-inimigos.md
    referenced_by:
      - design/gdd/horda-waves-e-inimigos.md
    variables:
      - dps_ref_tank_horda_per_s
      - HP_horda
      - inicio_chefe_ticks
      - hp_med_fase
      - teto_vivos_horda
    output_range: [0, 3.4e38]
    expression: "rho = HP_horda / (dps_tick * inicio_chefe_ticks); B_t = max(0, B_t-1 + chegada_t - dps_tick); arrivals and body count both use the weighted mean HP (hp_med); saturacao_pct, espera_no_chefe and RespiroCurto from B_t / hp_med_fase; RugidoMuitosNiveis when niveis_no_rugido > niveis_rugido_max, where XP_cheio = min(teto, vivos_est_chefe)*max_xp_horda + max_xp_elite, XP_rugido = floor(XP_cheio*xp_rugido_permil/1000), pre = max(0, xp_min - XP_cheio) and niveis_no_rugido counts acum(n) in (pre, pre + XP_rugido]"
    notes: "Non-blocking signal (CargaTankAlta, RespiroCurto, RugidoMuitosNiveis). The #3 applies at most niveis_rugido_max (1) level from the roar; the rest of the XP is lost. Becomes blocking once the Tank kill rate comes from #6, #8 and #10. Provisional."
    added: 2026-11-05
    revised: ""


