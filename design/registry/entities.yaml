      - design/gdd/horda-waves-e-inimigos.md
    variables:
      - seedMestre
      - w
    output_range: [0, 18446744073709551615]
    expression: "base = Mix(seedMestre XOR 0); seed_w = Mix(base XOR w); gerador_w = Pcg32(seed_w, seq = w)"
    notes: "Provisional derivation. #7 (Horda) must draw a wave only from its own generator and make the wave depend only on seedMestre, w and data, never on kills or ticks. w must be unique in the phase schedule (GDD #2 OQ-9)."
    added: 2026-11-04
    revised: ""
  - name: eixo_limitado
    status: active
    source: design/gdd/simulacao-deterministica.md
    referenced_by:
      - design/gdd/simulacao-deterministica.md
    variables:
      - X
      - Y
      - eixo_max
    output_range: [-1, 1]
    expression: "m2 = X*X + Y*Y; if m2 > 1 then (X, Y) = (X, Y) * (1 / Sqrt(m2))"
    notes: "Modulus is at most 1 plus a few ulp of float rounding; #6 must not assume a strict 1. Commands with a non-finite axis or an absolute value above eixo_max are dropped before this."
    added: 2026-11-04
    revised: ""
  - name: hash_estado
    status: active
    source: design/gdd/simulacao-deterministica.md
    referenced_by:
      - design/gdd/simulacao-deterministica.md
      - design/gdd/fluxo-de-fase.md
      - design/gdd/combate-e-dano.md
      - design/gdd/horda-waves-e-inimigos.md
    variables:
      - b
      - h0
    output_range: [0, 18446744073709551615]
    expression: "FNV-1a 64: h0 = 0xCBF29CE484222325; per byte h = (h XOR b) * 0x100000001B3; floats enter by their bits with -0 normalised to +0"
    notes: "Byte order is explicit little-endian by shifts. Out of the hash: previous position, EventBuffer, the 8 diagnostic counters of GDD #2 Rule 10 (DroppedEvents, CommandsRejected, SpawnsRejected, NonFiniteCount, GolpesDescartados, GolpesLimitados, ModForaDeFaixa, CurasDescartadas), the snapshot and the capacities. In the hash: CurrentTick, CombatTick, CombatHold, id counter, the 3 streams, and per id: alive, faction, Essencial, HP, x, y. The hash is per byte (provisional); the word-wise variant was dropped."
    added: 2026-11-04
    revised: 2026-11-05
    # was (/consistency-check 2026-11-05, stale): notes "the 4 diagnostic counters"
    # was (simulacao-deterministica.md, /design-review 2026-11-04): notes "the 7 diagnostic counters ... Word-wise variant is provisional, to decide in the hash spike"; CombatHold and Essencial were not listed
    # was (simulacao-deterministica.md, /design-review 2026-11-04, 2nd pass): notes "the 5 diagnostic counters" (CommandsOutOfOrder was cut; 4 remain)
  - name: capacidade_ids_ok
    status: active
    source: design/gdd/simulacao-deterministica.md
    referenced_by:
      - design/gdd/simulacao-deterministica.md
