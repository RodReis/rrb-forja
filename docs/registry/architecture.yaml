    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    signal_signature: "ISaveStorage (PersistentRoot, WriteAll with flush, TryReadAll and TryList returning Ok, NotFound or IoError, Exists, Replace atomic, MoveNoOverwrite, Delete, FsyncDirectory); Android implementation lives in Forja.Gameplay, an in-memory one with fault injection in the tests"
    referenced_by:
      - docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    added: 2026-11-05
    revised: ""
  - contract: save_events
    status: active
    pattern: direct_call
    producer: save-local-28
    consumers:
      - event-log-5
    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    signal_signature: "ISaveEventSink.Emit(in SaveEvent); null sink by default and a buffer for events raised at boot before the #5 subscribes"
    referenced_by:
      - docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
      - design/gdd/save-local.md
    added: 2026-11-05
    revised: ""

