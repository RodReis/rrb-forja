# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: unityengine_in_simulation
    status: active
    description: "Code in Forja.Simulation and in any system called from ISimSystem.Step must not reference UnityEngine, MonoBehaviour, ScriptableObject, Time, Mathf, Vector3 or Unity.Mathematics."
    why: "Keeps the simulation headless and testable in EditMode with the same code as the game, and keeps determinism out of engine behavior that docs/engine-reference does not cover."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
  - pattern: event_as_inter_system_channel
    status: active
    description: "Simulation events are output only. A system must not read events emitted in the same tick as a channel to another system; internal communication goes through SimWorld."
    why: "Subscription or emission order must never become a rule; the fixed system order and shared state keep ticks reproducible."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
  - pattern: mutable_static_in_simulation
    status: active
    description: "Forja.Simulation must not hold mutable static state; stream tables, SimMath and lookup tables are immutable."
    why: "With Enter Play Mode Options and no domain reload, static state survives between runs and breaks reproducibility."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
  - pattern: unordered_iteration_for_effect_order
    status: active
    description: "Effect order inside a tick must not come from iterating Dictionary or HashSet; iterate by ascending index."
    why: "Unordered collections can yield a different order between runs, which changes the result for the same seed and commands."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03

