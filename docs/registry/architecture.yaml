# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: unityengine_in_simulation
    status: active
    description: "Code in Forja.Simulation and in any system called from ISimSystem.Step must not reference UnityEngine, MonoBehaviour, ScriptableObject, Time, Mathf, Vector3 or Unity.Mathematics."
    why: "Keeps the simulation headless and testable in EditMode with the same code as the game, and keeps determinism out of engine behavior that docs/engine-reference does not cover."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
  - pattern: event_as_inter_system_channel
    status: active
    description: "Simulation events are output only. A system must not read events emitted in the same tick as a channel to another system; internal communication goes through SimWorld."
    why: "Subscription or emission order must never become a rule; the fixed system order and shared state keep ticks reproducible."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
  - pattern: mutable_static_in_simulation
    status: active
    description: "Forja.Simulation, Forja.Data (and its editor assembly), Forja.Gameplay.Sim (compositor and systems, including the #3), the data loader in Forja.Gameplay, the bridge, Forja.Save and the Android storage adapter in Forja.Gameplay (which keeps the writer thread) must not hold mutable static state, including static events, static caches (editor menu caches too) and RuntimeInitializeOnLoadMethod; stream tables, SimMath and lookup tables are immutable; Simulation.Create is a static factory with no static field."
    why: "With Enter Play Mode Options and no domain reload, static state survives between runs and breaks reproducibility."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: 2026-11-05
    # was (ADR-0001 amendments, 2026-11-05): description "Forja.Simulation must not hold mutable static state; stream tables, SimMath and lookup tables are immutable."
    # was (ADR-0002, 2026-11-05): the list did not include Forja.Data, its editor assembly and the data loader
    # was (ADR-0003, 2026-11-05): the list did not include Forja.Save and the Android storage adapter
  - pattern: unordered_iteration_for_effect_order
    status: active
    description: "Effect order inside a tick must not come from iterating Dictionary or HashSet; iterate by ascending index."
    why: "Unordered collections can yield a different order between runs, which changes the result for the same seed and commands."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
  - pattern: authored_number_through_float
    status: active
    description: "An authored gameplay number must not pass through float or double (JsonUtility, a JSON number parsed by a library, ScriptableObject fields) before the decimal validation."
    why: "0.1 as float is 0.100000001 and would leave a safe range whose maximum is 0.1; the authored value must be validated exactly (GDD #1)."
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    added: 2026-11-05
  - pattern: data_conversion_during_phase
    status: active
    description: "No data file read, text parse or seconds-to-ticks conversion may happen between tick 0 and the end of the match; the phase data is complete, verified and immutable before the first tick."
    why: "GDD #1 Core Rule 7: nothing is read or converted while a phase runs, so determinism and the frame budget do not depend on loading."
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    added: 2026-11-05
  - pattern: culture_dependent_parse
    status: active
    description: "Parse and ToString of data values, ledgers, messages and hash text must use CultureInfo.InvariantCulture, and string sorts and compares of IDs must use StringComparer.Ordinal."
    why: "Windows in pt-BR uses a decimal comma and a culture-aware sort; either would change data, ledgers, the index assigned to each ID and the content hash."
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    added: 2026-11-05
  - pattern: playerprefs_for_progress
    status: active
    description: "PlayerPrefs must not hold game progress, seals, marks or any save slice; it is only for trivial preferences."
    why: "No atomicity, no backup, no checksum and no size control; the GDD #28 commit guarantees need files under ISaveStorage."
    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    added: 2026-11-05
  - pattern: save_during_phase
    status: active
    description: "The save must not write during a phase (from the BeginStage request to the end commit), nor inside Tick, nor be triggered from an ISimSystem; the pause does not write during a phase because the phase mark already covers it."
    why: "A phase never writes progress (ADR-0001 tick purity, GDD #28 rule 5); the phase mark is the only write and it happens before tick 0."
    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    added: 2026-11-05
  - pattern: save_main_thread_io
    status: active
    description: "No File, Directory or PlayerPrefs access to the save files outside the ISaveStorage implementation, and no disk access or serialization of the save on the main thread; the main thread only assembles the snapshot and reads results between frames. Scope: the save files only, the embedded data snapshot (data_embedded_load) is read synchronously at boot."
    why: "GDD #28 F3: the disk and the serialization stay off the main thread, and every access through ISaveStorage keeps each crash point testable with fault injection."
    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    added: 2026-11-05
  - pattern: wave_rng_cache_across_ticks
    status: active
    description: "SimWorld.RngWave must stay stateless: no cache of wave generators, no static table and no memoized field, because that would be state that crosses ticks outside the hash; it always derives from the immutable waveBase, never from the current state of a stream."
    why: "A generator cached across ticks and left out of the hash breaks replay without any error; the #7 draws the whole composition in Preparar precisely so no wave generator crosses ticks."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-05

