      - heroi-19
    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    signal_signature: "ISaveService on the main thread: RequestCommit(requestId, kind, in snapshot), BeginStage(requestId, in mark), CancelStage(requestId), ConsumeMark(in answer), TryDequeueResult(out CommitResult) read between frames; the requestId comes from one shared injected source used by all callers (#3, #17), unique across them; CommitResult carries RequestId, AttemptId (128 bits, compared by equality only, from an injected source), Outcome (Pending, Confirmed, Failed, never a timeout); a replaced request still gets its own result; on replacement the backup rotation follows the strongest kind (Seal) and the stage mark follows the last request, so CancelStage never writes the mark; Confirmed only after FsyncDirectory"
    referenced_by:
      - docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
      - design/gdd/save-local.md
      - design/gdd/fluxo-de-fase.md
    added: 2026-11-05
    revised: 2026-11-05
    # was (ADR-0003 revision, 2026-11-05): signal_signature "...the caller passes the requestId, CommitResult carries RequestId, AttemptId, Outcome (Pending, Confirmed, Failed, never a timeout); a replaced request still gets its own result; Confirmed only after FsyncDirectory"; referenced_by without design/gdd/fluxo-de-fase.md
  - contract: save_storage
    status: active
    pattern: direct_call
    producer: android-storage
    consumers:
