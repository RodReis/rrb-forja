# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: sim_random
    status: active
    api: "Pcg32 (Forja.Simulation), one instance per RngStream, seed SplitMix64(masterSeed ^ streamId); ctx.RngWave(w) derives the per-wave generator: base = Mix(masterSeed XOR 0), seed_w = Mix(base XOR w), Pcg32(seed_w, seq = w), stored in a local variable (mutable struct)"
    not: "UnityEngine.Random, System.Random"
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    reason: "Seeded independent streams (Spawn, Offer, Loot) reproducible in the same build; Unity and System RNG are not controllable or portable"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: 2026-11-05
    # was (ADR-0001 amendments, 2026-11-05): api "Pcg32 (Forja.Simulation), one instance per RngStream, seed SplitMix64(masterSeed ^ streamId)"; RngWave(w) added per GDD #2 FS6
  - purpose: sim_numeric_type
    status: active
    api: "float (System.Single) with all non-basic math through SimMath; no transcendental functions in simulation state"
    not: "double, decimal in the simulation state (decimal is allowed in Forja.Data, for validation at build, in the editor and for remote packages), Unity.Mathematics, UnityEngine.Mathf, Vector3"
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    reason: "Same-build determinism at the lowest formula cost for the MVP; fixed point is the registered replacement if #22 or #40 need cross-device verification"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
      - docs/architecture/adr-0006-vetor-geometria-e-consulta-espacial-deterministicos.md
    added: 2026-11-03
    revised: 2026-11-05
    # was (ADR-0002, 2026-11-05): not "double, decimal, Unity.Mathematics, UnityEngine.Mathf, Vector3"; the ban on decimal applies only to the simulation state
  - purpose: sim_time
    status: active
    api: "SimClock.TicksPerSecond = 30, simulation works in integer ticks; data authored in seconds, converted once at build in Forja.Data: duration floor(s * 30 + 0.5) and rejected below 1 tick, rate by second divided in decimal (r / 30) and converted once to float by the own integer-only routine; the baked ticks and float bits are read by the simulation, which never converts"
    not: "Time.deltaTime, Time.time, wall clock"
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    reason: "Result depends only on seed and per-tick commands, never on frame timing"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
      - docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    added: 2026-11-03
    revised: 2026-11-05
    # was (ADR-0002, 2026-11-05): api "... data authored in seconds, converted at load by round-to-nearest with a 1 tick minimum"; the conversion moved from the load to the build and rates are now divided in decimal instead of multiplied by SimClock.TickSeconds (ADR-0001 amended)
  - purpose: data_authoring_format
    status: active
    api: "JSON in Assets/GameData/ with every number written as text, read by an own tokenizer in Forja.Data into decimal with CultureInfo.InvariantCulture and NumberStyles.AllowLeadingSign | AllowDecimalPoint (no exponent)"
    not: "JsonUtility, ScriptableObject, plain JSON numbers, a third-party JSON package without technical-director approval"
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    reason: "The authored value must never pass through float or double before validation (GDD #1); text keeps the value exact and diffable in git"
    referenced_by:
      - docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
      - design/gdd/dados-e-balanceamento.md
    added: 2026-11-05
    revised: ""
  - purpose: data_decimal_to_float
    status: active
    api: "Own integer-only routine DecimalToFloat in Forja.Data (decimal.GetBits, round to nearest even, no double): the single decimal to float conversion, done in the baker; the bits are stored in the snapshot"
    not: "(float)decimal, Convert.ToSingle, double, a conversion at runtime on embedded data"
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    reason: "Updating the editor or migrating its runtime must never change bits, skill revisions or the content hash; provisional, checked against (float)decimal in a battery of values"
    referenced_by:
      - docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
      - design/gdd/dados-e-balanceamento.md
    added: 2026-11-05
    revised: ""
  - purpose: data_content_hash
    status: active
    api: "FNV-1a 64-bit per byte over the canonical snapshot bytes: one hash per section in the directory and one for the whole file in the header; effective version hash = FNV-1a 64 over (embedded hash then pack hash), equal to the embedded hash when there is no pack"
    not: "SHA-256 and other System.Security.Cryptography hashes, GetHashCode, hashing raw struct memory"
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    reason: "Identity and detection of accidental corruption, not security; no dependency; the remote package integrity and signature belong to the #29 ADR"
    referenced_by:
      - docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
      - docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    added: 2026-11-05
    revised: ""
  - purpose: data_embedded_load
    status: active
    api: "The snapshot is a .bytes file imported as TextAsset, referenced by a [SerializeField] of a boot component and read synchronously before tick 0; SnapshotVerifier runs at boot (header, directory, catalog) and per phase section"
