  - purpose: frame_rate_target
    status: active
    api: "Application.targetFrameRate = 60 and QualitySettings.vSyncCount = 0 set in the bootstrap, with Optimized Frame Pacing on in the Android Player Settings (NOT SOURCEABLE in docs/engine-reference)"
    not: "leaving the Android default (it can fall to 30 fps, so every frame would count as missed and the LoadGovernor would stay in High)"
    adr: docs/architecture/adr-0010-orcamento-de-frame-por-sistema-e-de-entrada-na-fase.md
    reason: "The missed-frame rule and T assume a 60 fps target; a 90 Hz screen alternates 11 and 22 ms at 60 fps, and the rate for that case is still open"
    referenced_by:
      - docs/architecture/adr-0010-orcamento-de-frame-por-sistema-e-de-entrada-na-fase.md
    added: 2026-11-06
    revised: ""
    # provisional (ADR-0010, Verification Required 2): measure on the reference device, including a 90 Hz screen

