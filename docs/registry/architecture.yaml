# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: sim_commands
    status: active
    pattern: direct_call
    producer: presentation-or-policy
    consumers:
      - simulation
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    signal_signature: "Simulation.Tick(ReadOnlySpan<Command> commands)"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: ""
  - contract: sim_events
    status: active
    pattern: shared_resource
    producer: simulation
    consumers:
      - presentation
      - event-log
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    signal_signature: "Simulation.Events (ReadOnlySpan<SimEvent>, output only, no side effect, valid until next Tick) and Simulation.DrainEvents() (returns the events of the last Tick and marks the buffer drained; call after every Tick); Simulation.DroppedEvents never silent"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: 2026-11-05
    # was (ADR-0001 amendments, 2026-11-05): signal_signature "Simulation.Events (ReadOnlySpan<SimEvent>, output only, valid until next Tick, drained after every Tick; Simulation.DroppedEvents never silent)"; DrainEvents() added so that an undrained buffer is detectable
  - contract: phase_lifecycle
    status: active
    pattern: direct_call
    producer: compositor
    consumers:
      - fluxo-de-fase-3
      - grimorio-16
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    signal_signature: "IPreparaFase.Preparar(SimWorld) after Create and before the first Tick; IConcluiFase.Concluir(in PhaseResult) after the last Tick (or abandon, Preparar failure, Broken) and before Discard, on every cause; typed lists built by direct reference, no reflection"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
      - design/gdd/fluxo-de-fase.md
    added: 2026-11-05
    revised: ""
