    write_access: "isimsystem-within-tick; plus the Spawn made by IPreparaFase.Preparar in state Created (whole row with hp and position, essential flag, no event)"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: 2026-11-05
    # was (ADR-0001 amendments, 2026-11-05): write_access "isimsystem-within-tick-only"; the #3 now creates the hero in Preparar, before tick 0 (GDD #3 rule 3.4)
  - state: combat_hold
    status: active
    owner_system: grimorio-16
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    interface: "SimWorld.CombatHold (int: 0 free, 1 offer pending, 2 waiting resume); read by the Core to take the CombatActive snapshot at the start of each tick; included in the SimWorld hash"
    write_access: "grimorio-16-only, inside the Tick only; the setter throws in every other state"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
