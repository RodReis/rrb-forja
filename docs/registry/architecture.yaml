# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: unityengine_in_simulation
    status: active
    description: "Code in Forja.Simulation and in any system called from ISimSystem.Step must not reference UnityEngine, MonoBehaviour, ScriptableObject, Time, Mathf, Vector3 or Unity.Mathematics."
    why: "Keeps the simulation headless and testable in EditMode with the same code as the game, and keeps determinism out of engine behavior that docs/engine-reference does not cover."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
  - pattern: event_as_inter_system_channel
    status: active
    description: "Simulation events are output only. A system must not read events emitted in the same tick as a channel to another system; internal communication goes through SimWorld, with the only exception of the three direct channels of ADR-0001 Emenda 18 (the consumer request queue, the hashed accumulator written only by its owner, the read-only view), always handed over by the compositor by reference and never by event."
    why: "Subscription or emission order must never become a rule; the fixed system order and shared state keep ticks reproducible."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: 2026-11-06
    # was (ADR-0001 Emenda 18, 2026-11-06): description "Simulation events are output only. A system must not read events emitted in the same tick as a channel to another system; internal communication goes through SimWorld."
  - pattern: mutable_static_in_simulation
    status: active
    description: "Forja.Simulation, Forja.Data (and its editor assembly), Forja.Gameplay.Sim (compositor and systems, including the #3), the data loader in Forja.Gameplay, the bridge, Forja.Save and the Android storage adapter in Forja.Gameplay (which keeps the writer thread) must not hold mutable static state, including static events, static caches (editor menu caches too) and RuntimeInitializeOnLoadMethod; stream tables, SimMath and lookup tables are immutable; Simulation.Create is a static factory with no static field."
    why: "With Enter Play Mode Options and no domain reload, static state survives between runs and breaks reproducibility."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: 2026-11-05
    # was (ADR-0001 amendments, 2026-11-05): description "Forja.Simulation must not hold mutable static state; stream tables, SimMath and lookup tables are immutable."
    # was (ADR-0002, 2026-11-05): the list did not include Forja.Data, its editor assembly and the data loader
    # was (ADR-0003, 2026-11-05): the list did not include Forja.Save and the Android storage adapter
  - pattern: unordered_iteration_for_effect_order
    status: active
    description: "Effect order inside a tick must not come from iterating Dictionary or HashSet; iterate by ascending index."
    why: "Unordered collections can yield a different order between runs, which changes the result for the same seed and commands."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
  - pattern: authored_number_through_float
    status: active
    description: "An authored gameplay number must not pass through float or double (JsonUtility, a JSON number parsed by a library, ScriptableObject fields) before the decimal validation."
    why: "0.1 as float is 0.100000001 and would leave a safe range whose maximum is 0.1; the authored value must be validated exactly (GDD #1)."
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    added: 2026-11-05
  - pattern: data_conversion_during_phase
    status: active
    description: "No data file read, text parse or seconds-to-ticks conversion may happen between tick 0 and the end of the match; the phase data is complete, verified and immutable before the first tick."
    why: "GDD #1 Core Rule 7: nothing is read or converted while a phase runs, so determinism and the frame budget do not depend on loading."
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    added: 2026-11-05
  - pattern: culture_dependent_parse
    status: active
    description: "Parse and ToString of data values, ledgers, messages and hash text must use CultureInfo.InvariantCulture, and string sorts and compares of IDs must use StringComparer.Ordinal."
    why: "Windows in pt-BR uses a decimal comma and a culture-aware sort; either would change data, ledgers, the index assigned to each ID and the content hash."
    adr: docs/architecture/adr-0002-dados-e-balanceamento-snapshot-imutavel-gerado-no-build.md
    added: 2026-11-05
  - pattern: playerprefs_for_progress
    status: active
    description: "PlayerPrefs must not hold game progress, seals, marks or any save slice; it is only for trivial preferences."
    why: "No atomicity, no backup, no checksum and no size control; the GDD #28 commit guarantees need files under ISaveStorage."
    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    added: 2026-11-05
  - pattern: save_during_phase
    status: active
    description: "The save must not write during a phase (from the BeginStage request to the end commit), nor inside Tick, nor be triggered from an ISimSystem; the pause does not write during a phase because the phase mark already covers it."
    why: "A phase never writes progress (ADR-0001 tick purity, GDD #28 rule 5); the phase mark is the only write and it happens before tick 0."
    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    added: 2026-11-05
  - pattern: save_main_thread_io
    status: active
    description: "No File, Directory or PlayerPrefs access to the save files outside the ISaveStorage implementation, and no disk access or serialization of the save on the main thread; the main thread only assembles the snapshot and reads results between frames. Scope: the save files only, the embedded data snapshot (data_embedded_load) is read synchronously at boot."
    why: "GDD #28 F3: the disk and the serialization stay off the main thread, and every access through ISaveStorage keeps each crash point testable with fault injection."
    adr: docs/architecture/adr-0003-save-local-envelope-tlv-commit-atomico-gravador-unico.md
    added: 2026-11-05
  - pattern: wave_rng_cache_across_ticks
    status: active
    description: "SimWorld.RngWave must stay stateless: no cache of wave generators, no static table and no memoized field, because that would be state that crosses ticks outside the hash; it always derives from the immutable waveBase, never from the current state of a stream."
    why: "A generator cached across ticks and left out of the hash breaks replay without any error; the #7 draws the whole composition in Preparar precisely so no wave generator crosses ticks."
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-05
  - pattern: scratch_surviving_tick
    status: active
    description: "Per-tick scratch of the #6 (golpe queue, acc, the Rugido signal, vivoNoInicio, intentVel) must be empty at the end of every Step, including the early return without CombatActive, and must be rewritten before it is read in the next tick."
    why: "Scratch stays out of the hash, so any scratch that survives a tick is hidden state that breaks replay without any error."
    adr: docs/architecture/adr-0004-colunas-do-simworld-combate-e-horda.md
    added: 2026-11-06
    revised: 2026-11-06
    # was (ADR-0005 sync note, 2026-11-06): description listed curaAcc among the scratch; the heal has no scratch
  - pattern: column_realloc_in_phase
    status: active
    description: "No entity column array (SimWorld or the #6 tables) may be reallocated, resized or swapped after Preparar; the only reallocation allowed is the one in the #6 Preparar when Length is below EntityCapacity."
    why: "Spans taken at the start of a Step must stay valid for the whole tick, and a reallocation would also drop the zero initial state the hash relies on."
    adr: docs/architecture/adr-0004-colunas-do-simworld-combate-e-horda.md
    added: 2026-11-06
  - pattern: writable_column_exposure
    status: active
    description: "No writable Span of a private column of the #6 may leave the #6, and HpAndPosForWrite must be called only by the #6; the read view exposes ReadOnlySpan only."
    why: "The single-writer rule for HP, position and combat state is what keeps the hash order independent of system wiring; the Tick guard cannot tell callers apart."
    adr: docs/architecture/adr-0004-colunas-do-simworld-combate-e-horda.md
    added: 2026-11-06
  - pattern: core_emits_rule_event
    status: active
    description: "SimWorld.Kill, SimWorld.Spawn and any other Core code must not emit rule events (Death, Spawn, Damage and the like); the system that decides emits them."
    why: "A Core event per death or per spawn makes 300 deaths in one tick 300 events and ties the Core to the combat vocabulary and to which classes are aggregated."
    adr: docs/architecture/adr-0005-pipeline-de-dano-e-eventos-de-combate.md
    added: 2026-11-06
  - pattern: kill_outside_combat
    status: active
    description: "Only the #6 (and the Core on the non-finite value path) may call SimWorld.Kill; no other system may kill an entity."
    why: "With Kill emitting no event, a second caller would produce a death without its event and without the cause rules of the #6."
    adr: docs/architecture/adr-0005-pipeline-de-dano-e-eventos-de-combate.md
    added: 2026-11-06
  - pattern: request_queue_reorder
    status: active
    description: "The #6 request queue must not be sorted, deduplicated, merged or summed out of insertion order, and a request must not carry a precomputed modDano."
    why: "The float32 sum per target depends on the order and the order is part of the contract (Rugido, #8, impacts by attacker id, contacts, auto-attack); one source for modDano keeps F1 single-valued."
    adr: docs/architecture/adr-0005-pipeline-de-dano-e-eventos-de-combate.md
    added: 2026-11-06
  - pattern: float_equality_on_geometry
    status: active
    description: "No == or Equals between float values or SimVec2 in the simulation; two vectors are told apart by an integer (the vector class id of the #7), never by float equality."
    why: "Float equality is fragile to a single ulp and would change a hit, a mirror or a tie without any error."
    adr: docs/architecture/adr-0006-vetor-geometria-e-consulta-espacial-deterministicos.md
    added: 2026-11-06
  - pattern: sqrt_to_decide_hit
    status: active
    description: "A hit, reach, contact, suppression or range test must not use Sqrt; it compares squared distances (Sqrt is only for Dir, a hand-written length and the stopping step of the #6)."
    why: "A square root adds a rounding and a cost with no change in the logical result."
    adr: docs/architecture/adr-0006-vetor-geometria-e-consulta-espacial-deterministicos.md
    added: 2026-11-06
  - pattern: time_scale_for_pause
    status: active
    description: "Time.timeScale must not be used for the pause or for slow motion: the pause is zero calls to Tick and slow motion is the discard of the FS1 excess; Time.timeScale stays 1 (asserted in development)."
    why: "The accumulator uses real unscaled time, so the scale would be inconsistent, it would freeze the animations and audio that the pause menu needs, and it would skip instead of slowing down."
    adr: docs/architecture/adr-0007-ponte-de-entrada-tempo-e-ciclo-de-vida-do-app.md
    added: 2026-11-06
  - pattern: tick_outside_host_update
    status: active
    description: "Simulation.Tick must be called only from the Update of the PhaseHost, on the main thread, with Status Running; never from a callback of the app, FixedUpdate, LateUpdate or a coroutine."
    why: "A tick during a pause or inside a callback breaks the zero-ticks-in-pause guarantee and the single-thread rule of the Core."
    adr: docs/architecture/adr-0007-ponte-de-entrada-tempo-e-ciclo-de-vida-do-app.md
    added: 2026-11-06
  - pattern: focus_as_save_trigger
    status: active
    description: "OnApplicationFocus must never trigger a save write; only OnApplicationPause(true) does, outside a phase only. Focus lost is a pause reason (FocusLost) that stops the ticks and writes nothing."
    why: "Focus also fires for a notification or a floating window and would write for nothing; ADR-0003 forbids Focus for the save and the GDD #2 needs it only to stop the ticks."
    adr: docs/architecture/adr-0007-ponte-de-entrada-tempo-e-ciclo-de-vida-do-app.md
    added: 2026-11-06
  - pattern: bridge_clock_in_tick_systems
    status: active
    description: "A system called by ISimSystem.Step must not reference IFrameClock, TickPacer or PauseGate; the code with a real clock lives in Forja.Gameplay.Sim.Host, a namespace apart from the tick systems in the same assembly."
    why: "Only a convention separates real-time code from tick code inside one asmdef; a reference would put wall time into the deterministic simulation."
    adr: docs/architecture/adr-0007-ponte-de-entrada-tempo-e-ciclo-de-vida-do-app.md
    added: 2026-11-06
  - pattern: pause_as_bool
    status: active
    description: "The pause must not be reduced to a bool: it is a set of reasons (PauseReason flags) and the game resumes only when the set is empty."
    why: "Focus and app pause arrive together and in either order, and the abandon dialog must keep the pause after the focus returns; a bool resumes too early."
    adr: docs/architecture/adr-0007-ponte-de-entrada-tempo-e-ciclo-de-vida-do-app.md
    added: 2026-11-06
  - pattern: sim_references_log
    status: active
    description: "Forja.Simulation and any system called by ISimSystem.Step must not reference Forja.Gameplay.Sim.Log or read the log, not even to decide a rule; only the host feeds the log with what DrainEvents returns."
    why: "Events are output only; a system reading the log would make the order of subscription a rule, and the two namespaces share one assembly, so only a code review rule separates them."
    adr: docs/architecture/adr-0008-log-de-eventos-e-instrumentacao-do-5.md
    added: 2026-11-06
  - pattern: log_throws_into_game
    status: active
    description: "No exception of the log may reach the tick loop, the TentativaDeFase or the UI, and the log must never block the main thread on the disk; every public method of the PhaseLog and the LogWriter catches, adds to LogFaults and sets Degraded, and the try/catch is the outermost one of the worker callback."
    why: "An unhandled exception in a ThreadPool item brings the process down, and a telemetry failure must not cost the player a phase."
    adr: docs/architecture/adr-0008-log-de-eventos-e-instrumentacao-do-5.md
    added: 2026-11-06
  - pattern: silent_log_loss
    status: active
    description: "A log record must not be dropped without adding to RecordsDropped and setting Truncated, and a log fault must not pass without adding to LogFaults and setting Degraded; both go into the file footer."
    why: "A silent loss makes a truncated log read as a complete one, and the acceptance would count a phase that the log did not see."
    adr: docs/architecture/adr-0008-log-de-eventos-e-instrumentacao-do-5.md
    added: 2026-11-06
  - pattern: comparer_diverges_when_not_comparable
    status: active
    description: "LogComparer must not answer Divergence for a pair that is not comparable, and must not treat an empty or unknown Abi or BuildTag, a missing final hash or a Pending commit as equal; it answers NotComparable with the reason. A divergence found before the missing hash still stands."
    why: "GDD #2 says a pair with a different ABI, build tag or data hash is not comparable; an absent value read as permissive would pass a comparison that never ran."
    adr: docs/architecture/adr-0008-log-de-eventos-e-instrumentacao-do-5.md
    added: 2026-11-06
  - pattern: presentation_writes_sim
    status: active
    description: "The presentation must never write to the simulation, call Tick, Spawn or Kill, or keep state that enters the hash or the log as game state; it only reads spans, views and drained events."
    why: "A render-side write would change the hash with no error, and the simulation must stay deterministic and runnable headless."
    adr: docs/architecture/adr-0009-render-de-multidao-e-vfx-em-mobile.md
    added: 2026-11-06
  - pattern: sim_references_presentation
    status: active
    description: "Forja.Simulation and any system called by ISimSystem.Step must not reference Forja.Gameplay.Sim.View or Forja.Gameplay.Presentation."
    why: "Sim.View shares an assembly with the tick systems, so only a code review rule separates them; a separate assembly that references the Sim and is not referenced by it would make it a compile error (a pending project decision)."
    adr: docs/architecture/adr-0009-render-de-multidao-e-vfx-em-mobile.md
    added: 2026-11-06
  - pattern: effect_uses_real_time
    status: active
    description: "A combat shader or script must not read _Time, Time.time, Time.deltaTime or Time.timeScale, and an age computation must not use half or fixed precision; every effect is a function of SimTickF in float."
    why: "Pause, the card-choice menu and CombatHold would not freeze the effect, and half loses the step above 32768 ticks, about 18 minutes."
    adr: docs/architecture/adr-0009-render-de-multidao-e-vfx-em-mobile.md
    added: 2026-11-06
  - pattern: skinned_horde
    status: active
    description: "A horde body must not have a SkinnedMeshRenderer, a GameObject, an Animator, a Collider, a particle, a decal or a sound of its own; the horde is drawn only by the instanced draw."
    why: "300 renderers and animators would blow the CPU and the 150-draw ceiling of the art bible; any per-body effect is forbidden by the GDD #7."
    adr: docs/architecture/adr-0009-render-de-multidao-e-vfx-em-mobile.md
    added: 2026-11-06
  - pattern: deaths_read_after_tick
    status: active
    description: "DeathsThisTick must not be read from the LateUpdate or any place other than IPresentationSink.OnTick, which the PhaseHost calls after every Tick including the one that ends the phase."
    why: "The Core clears the list every tick; a frame that runs several ticks would lose every death but the last."
    adr: docs/architecture/adr-0009-render-de-multidao-e-vfx-em-mobile.md
    added: 2026-11-06
  - pattern: prewarm_blocks_phase
    status: active
    description: "The boss prewarm must not hold the phase past PREWARM_MAX_WAIT_MS, and must not be done inside Preparar; after the ceiling the phase starts, the load continues and PrewarmIncomplete is logged."
    why: "A prewarm that hangs would cost the player a phase, and Preparar is synchronous pure C# that cannot wait for asynchronous loading."
    adr: docs/architecture/adr-0009-render-de-multidao-e-vfx-em-mobile.md
    added: 2026-11-06
  - pattern: sim_reads_realtime_measure
    status: active
    description: "No tick system, command or game rule may read ITickProbe, a LatencyHistogram, the LoadGovernor level, a frame time or any other real-time measure; the probe and the governor are output only, and the LoadLevel never enters the hash or the log as state."
    why: "A measure that depends on the real clock would make the simulation depend on the device; the narrow exception to real_time_source is measurement that never returns to the simulation."
    adr: docs/architecture/adr-0010-orcamento-de-frame-por-sistema-e-de-entrada-na-fase.md
    added: 2026-11-06
  - pattern: perf_degrades_simulation
    status: active
    description: "Performance must never degrade the simulation: no skipped tick, no changed tick rate, no fewer enemies or changed phase content at run time. The game slows only through MaxTicksPerFrame (and k x X1_p99 + R_p95 <= 33.3 ms must hold); only the presentation cuts, through the LoadLevel."
    why: "GDD #2 rule 11: the game slows down and never skips or changes the content of the phase for performance; a device-dependent simulation breaks the seed and the hash."
    adr: docs/architecture/adr-0010-orcamento-de-frame-por-sistema-e-de-entrada-na-fase.md
    added: 2026-11-06
  - pattern: system_without_budget_line
    status: active
    description: "An ISimSystem must declare a valid BudgetLine (L1, L2, L3 or L5) and Simulation.Create throws otherwise; no system takes frame time without a line in the FrameLedger, and the sum of the p95 of the lines must stay at or below T."
    why: "Without a line the sum can pass T with nothing to flag it, and a slot taken from the list position would swap lines when the list is reordered."
    adr: docs/architecture/adr-0010-orcamento-de-frame-por-sistema-e-de-entrada-na-fase.md
    added: 2026-11-06
  - pattern: alloc_after_first_tick
    status: active
    description: "Every phase allocation (SimWorld arrays, the instance texture, pools, histograms, log buffers) happens inside the phase entry window; none after the first Tick, and GcCollections must be 0 in a steady phase."
    why: "A collection in the middle of a phase blows the frame, and incremental GC does not avoid it; allocations that escape usually come from the engine, so the invariant is measured in Release."
    adr: docs/architecture/adr-0010-orcamento-de-frame-por-sistema-e-de-entrada-na-fase.md
    added: 2026-11-06
  - pattern: sync_load_in_phase
    status: active
    description: "No synchronous load, no Resources.Load, no WaitForCompletion and no asset load after the first Tick; the mandatory assets of the phase are resident before it, and a phase never starts with a mandatory asset still loading (the entry fails at ENTRY_MAX_MS)."
    why: "deprecated-apis.md bans Resources.Load and synchronous loading; a late load costs a frame on the hot path and breaks the zero-allocation rule."
    adr: docs/architecture/adr-0010-orcamento-de-frame-por-sistema-e-de-entrada-na-fase.md
    added: 2026-11-06

