# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: sim_random
    status: active
    api: "Pcg32 (Forja.Simulation), one instance per RngStream, seed SplitMix64(masterSeed ^ streamId)"
    not: "UnityEngine.Random, System.Random"
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    reason: "Seeded independent streams (Spawn, Offer, Loot) reproducible in the same build; Unity and System RNG are not controllable or portable"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: ""
  - purpose: sim_numeric_type
    status: active
    api: "float (System.Single) with all non-basic math through SimMath; no transcendental functions in simulation state"
    not: "double, decimal, Unity.Mathematics, UnityEngine.Mathf, Vector3"
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    reason: "Same-build determinism at the lowest formula cost for the MVP; fixed point is the registered replacement if #22 or #40 need cross-device verification"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: ""
  - purpose: sim_time
    status: active
    api: "SimClock.TicksPerSecond = 30, simulation works in integer ticks; data authored in seconds, converted at load by round-to-nearest with a 1 tick minimum"
    not: "Time.deltaTime, Time.time, wall clock"
    adr: docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    reason: "Result depends only on seed and per-tick commands, never on frame timing"
    referenced_by:
      - docs/architecture/adr-0001-simulacao-deterministica-float32-tick-30hz.md
    added: 2026-11-03
    revised: ""

# Example:
#
# api_decisions:
